name: Kuma Xiaoyu Xiong
position: PhD Student
affiliation: School of Creative Media, City University of Hong Kong
intro: I am a video game researcher interested in gender, fandom, and
  monetisation, particularly loot boxes. My research interests also extend to
  physical chance-based products, such as blind boxes, card packs, and gachapon.
sections:
  - title: About Me
    body: I am a PhD student at the School of Creative Media, City University of
      Hong Kong.
  - title: Research
    body: >
      Virtual intimate relationships and romance in video games, especially
      otome games.


      Affective experiences of video game players and activism in online gaming
      communities.


      Gacha mechanics in Japanese mobile games.
